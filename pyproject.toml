[project]
name = "robots"
version = "0.0.0"
description = "Agents that build and deploy robots"
requires-python = ">=3.11"
# Pin exact versions in hour 1, after confirming Menagerie models and mink load together.
# MuJoCo 4.0.0 shipped 2026-11-06, 4.0.1 on 2026-11-11 (see docs/ plan, "Risks").
dependencies = [
  "mujoco",    # TODO pin
  "mink",      # TODO pin
  "langgraph", # TODO pin
  "langchain-anthropic", # Claude for agent/design_flow LLM steps
  "langsmith>=0.14.9", # TODO pin; >=0.14.9 needed to trace to an agent (LANGSMITH_AGENT_ID)
  "numpy",
  "anthropic",
  "jsonschema",
  "trimesh>=5.2.1",
  "scipy",     # world/mesh.py
  "httpx",     # world/matterport.py, through Pathfinder's Matterport client
  "pillow",    # world/scan.py: the scan's textures for the pictures
]

[dependency-groups]
dev = [
  "jsonschema>=4.18", # contracts/validate.py; 4.18+ has referencing
]

[tool.pytest.ini_options]
# world/pathfinder is its own project with its own environment: run its tests from world/pathfinder/backend
norecursedirs = ["world/pathfinder", ".claude", "runs", "catalog/_assets", "web/_vendor"]
