<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Robot in the room</title>
<style>
  /* The chrome is Matterport's own viewer's: the scene edge to edge; top left the logo and the place's name; bottom left
     the views in a dark pill and three round buttons; bottom right share and a menu; and, for the robot, one slim pill of
     the same height in the middle. Nothing else shows until it is asked for. */
  :root { --ink: #fff; --dim: #c9c9c9; --glass: rgba(40, 40, 40, .85); --glass-2: rgba(30, 30, 30, .94); --h: 52px; color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #111; color: var(--ink); font: 14px/1.4 -apple-system, "Segoe UI", Roboto, Inter, sans-serif; overflow: hidden; }
  canvas { position: fixed; inset: 0; display: block; touch-action: none; }
  button, select { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; }
  button:focus-visible, select:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  [hidden] { display: none !important; }

  /* top left, straight on the scene: the scan's maker (its own logo file, from its SDK bundle) and the place */
  #shade { position: fixed; inset: 0 0 auto 0; height: 120px; background: linear-gradient(rgba(0, 0, 0, .42), rgba(0, 0, 0, 0)); pointer-events: none; }
  #top { position: fixed; left: 20px; top: 16px; display: grid; gap: 6px; text-shadow: 0 1px 4px rgba(0, 0, 0, .7); }
  #brand { display: block; line-height: 0; color: #fff; text-decoration: none; filter: drop-shadow(0 1px 3px rgba(0, 0, 0, .55)); border-radius: 4px; justify-self: start; }
  #brand img { height: 28px; width: auto; display: block; }
  #brand span { font: 500 27px/28px Georgia, "Times New Roman", serif; letter-spacing: -.01em; }
  #place { font-weight: 600; font-size: 15px; line-height: 1.3; max-width: min(300px, calc(100vw - 40px)); }

  /* along the bottom: views left, the robot's playback in the middle, share and menu right */
  #hud { position: fixed; left: 16px; right: 16px; bottom: 16px; display: flex; align-items: flex-end; gap: 12px; pointer-events: none; }
  #hud > * { pointer-events: auto; }
  #views, #more { display: flex; gap: 8px; align-items: center; position: relative; flex: none; }
  .pill { display: flex; align-items: center; gap: 2px; height: var(--h); padding: 0 4px; border-radius: 999px; background: var(--glass); }
  .round { width: var(--h); height: var(--h); border-radius: 50%; background: var(--glass); display: grid; place-items: center; position: relative; flex: none; transition: background .15s, color .15s; }
  .pill .round { width: 44px; height: 44px; background: none; }
  .round svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .round svg .solid { fill: currentColor; stroke: none; }
  .round:hover { background: rgba(70, 70, 70, .9); }
  .pill .round:hover { background: rgba(255, 255, 255, .14); }
  .round[aria-checked="true"], .round[aria-pressed="true"], .round[aria-expanded="true"] { background: #fff; color: #111; }   /* the one in use: a white disc, its icon in black */
  .round[data-tip]::after { content: attr(data-tip); position: absolute; left: 50%; bottom: calc(100% + 10px); transform: translateX(-50%); white-space: nowrap; background: var(--glass-2); color: #fff;
                            border-radius: 6px; padding: 4px 9px; font-size: 12px; opacity: 0; pointer-events: none; transition: opacity .12s; }
  .round[data-tip]:hover::after, .round[data-tip]:focus-visible::after { opacity: 1; }
  .round[aria-expanded="true"]::after { display: none; }
  #m-dollhouse::after { left: 0; transform: none; }
  #more .round::after { left: auto; right: 0; transform: none; }
  #floor b { position: absolute; right: 9px; bottom: 8px; min-width: 15px; height: 15px; border-radius: 8px; background: #fff; color: #111; font: 700 10px/15px -apple-system, "Segoe UI", sans-serif; text-align: center; padding: 0 3px; box-sizing: border-box; }
  #floor[aria-expanded="true"] b { background: #111; color: #fff; }
  .sheet { position: absolute; bottom: calc(100% + 10px); background: var(--glass-2); border-radius: 14px; padding: 8px; display: grid; gap: 2px; box-shadow: 0 10px 30px rgba(0, 0, 0, .35); }
  #floors { left: 0; min-width: 200px; }
  #floors button { padding: 9px 12px; border-radius: 8px; display: flex; justify-content: space-between; gap: 14px; text-align: left; }
  #floors button:hover { background: rgba(255, 255, 255, .12); }
  #floors button small { color: var(--dim); }
  #floors button[aria-checked="true"] { background: #fff; color: #111; }
  #floors button[aria-checked="true"] small { color: #444; }
  #menu { right: 0; width: min(340px, calc(100vw - 32px)); padding: 14px 16px; gap: 10px; font-size: 13px; line-height: 1.45; }
  #menu p { margin: 0; color: var(--dim); }
  #menu #msg { color: #fff; }
  #menu button { justify-self: start; padding: 9px 16px; border-radius: 999px; background: #fff; color: #111; font-weight: 600; }

  #bar { flex: 1 1 auto; min-width: 0; max-width: 760px; margin: 0 auto; gap: 10px; padding: 0 4px 0 4px; }
  #bar .round { color: #fff; }
  #bar .round[aria-pressed="true"] { color: #111; }
  #play .i-pause, #play.playing .i-play { display: none; }
  #play.playing .i-pause { display: block; }
  #seek { flex: 1 1 80px; min-width: 60px; height: 20px; margin: 0; background: none; cursor: pointer; -webkit-appearance: none; appearance: none; }
  #seek::-webkit-slider-runnable-track { height: 3px; border-radius: 2px; background: rgba(255, 255, 255, .34); }
  #seek::-webkit-slider-thumb { -webkit-appearance: none; width: 13px; height: 13px; margin-top: -5px; border-radius: 50%; background: #fff; }
  #seek::-moz-range-track { height: 3px; border-radius: 2px; background: rgba(255, 255, 255, .34); }
  #seek::-moz-range-thumb { width: 13px; height: 13px; border: 0; border-radius: 50%; background: #fff; }
  #time { font-size: 12px; font-variant-numeric: tabular-nums; color: var(--dim); flex: none; }
  #chapter { flex: 0 1 auto; min-width: 0; max-width: 250px; font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; -webkit-appearance: none; appearance: none; padding: 6px 2px; border-radius: 6px; }
  #speed { flex: none; font-size: 12.5px; font-weight: 600; -webkit-appearance: none; appearance: none; padding: 5px 10px; border-radius: 999px; background: rgba(255, 255, 255, .16); text-align: center; text-align-last: center; }
  #speed:hover, #chapter:hover { background: rgba(255, 255, 255, .24); }
  #chapter:hover { background: rgba(255, 255, 255, .12); }
  option { background: #222; color: #fff; }
  @media (max-width: 900px) { #hud { flex-wrap: wrap; } #bar { order: -1; flex-basis: 100%; max-width: none; } #more { margin-left: auto; } }

  /* a line that has something to say for a moment (a floor that is only partly scanned, a link copied), over the bar */
  #toast { position: fixed; left: 50%; bottom: calc(16px + var(--h) + 12px); transform: translateX(-50%); max-width: min(620px, calc(100% - 32px)); background: var(--glass-2); border-radius: 999px; padding: 8px 16px;
           font-size: 13px; text-align: center; pointer-events: none; }
  @media (max-width: 900px) { #toast { bottom: calc(16px + 2 * var(--h) + 24px); border-radius: 16px; } }

  /* measurements: a label over each dimension line */
  #tags { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  #tags span { position: absolute; left: 0; top: 0; white-space: nowrap; font: 600 11px/1.2 -apple-system, "Segoe UI", sans-serif; font-variant-numeric: tabular-nums; color: #111;
               background: rgba(255, 255, 255, .95); border-radius: 999px; padding: 2px 7px; will-change: transform; }
  #tags span.door { background: rgba(30, 30, 30, .92); color: #fff; }

  /* the scan's mesh is not on this machine: said once, at the top, where no button's hint replaces it */
  #notice { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); width: max-content; max-width: min(640px, calc(100% - 680px)); background: var(--glass-2); border-radius: 16px;
            padding: 9px 16px 9px 34px; font-size: 13px; line-height: 1.4; }
  #notice::before { content: ""; position: absolute; left: 15px; top: 14px; width: 9px; height: 9px; border-radius: 50%; background: #f0b441; }
  @media (max-width: 1100px) { #notice { top: 96px; max-width: calc(100% - 32px); } }

  /* ?vr=1, as the headset's launch page opens it: one large button in the middle, or the line that says what is missing */
  #vrgate { position: fixed; left: 50%; top: 42%; transform: translate(-50%, -50%); width: min(640px, calc(100% - 32px)); box-sizing: border-box; display: grid; justify-items: center; gap: 18px; text-align: center;
            background: var(--glass); border-radius: 28px; padding: 32px 28px; }
  #vr-big { font-size: 40px; font-weight: 700; line-height: 1; padding: 28px 68px; border-radius: 999px; background: #fff; color: #111; }
  #vr-big:disabled { opacity: .45; cursor: default; }
  #vr-why { margin: 0; font-size: 18px; line-height: 1.45; overflow-wrap: anywhere; }
  #vr-skip { font-size: 16px; padding: 12px 22px; border-radius: 999px; background: rgba(255, 255, 255, .16); }
  #vr-skip:hover { background: rgba(255, 255, 255, .26); }
</style>

  </div>
</div>

<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }</script>
<script type="module">
// The planned job played inside a mesh of the real room. Three ways to look at it, one at a time:
//   Explore 3D space  first person at eye height on one floor: drag to look, W A S D or the arrows to walk, click the floor to go there
//   Dollhouse         the building from outside, every floor or one: walls facing you are not drawn, and the rest of the
//                     walls are thin from far off and fill in as you move in
//   Floorplan         one floor from straight above, cut off above head height and below the floor
// plus a floor chooser, dimension lines (doorways, walls, the gaps between tables) and a switch that hides the furniture.
//
// The room is world/_scans/<world>/room.glb with its listing scan.json (levels; furniture pieces are named ..._furn), both
// written by world/scenarios/tools/stitch_scan.py and not committed. The robot and its motion are the run's
// frames/tour_robot.glb and tour_frames.bin. Positions are played back, not simulated.
// Without the room's mesh (another checkout, another machine) the page says so at the top and draws the world file's rooms,
// doorways and obstacles as outlines and boxes, so the robot is not in a void.
// In a headset (Enter VR; room.html?...&vr=1 puts that button in the middle, see docs/VR.md) you stand on the floor about
// two metres from the robot at full size, and the job starts. See "in a headset" below for the controls.
// Frames: the plan's is metres with Z up (X east, Y north); three.js has Y up, so a plan point (X, Y, Z) is drawn at (X, Z, -Y).
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const $ = id => document.getElementById(id), q = new URLSearchParams(location.search);
const run = (q.get("run") || "runs/gallery/jrr").replace(/^runs\//, ""), base = `/runs/${run}/`;
// What the page has to say. How to move in the current view lives in the menu (the three dots) and nowhere else; anything
// else (a floor that is only partly scanned, a link copied) also shows over the bar for a few seconds, or until replaced with `keep`.
let toastTimer = 0;
function say(t, keep = false) {
  const hint = Object.values(HINT).includes(t); if (!/^(Link copied|Could not copy)/.test(t)) $("msg").textContent = t;
  clearTimeout(toastTimer); $("toast").textContent = t; $("toast").hidden = hint;
  if (!hint && !keep) toastTimer = setTimeout(() => { $("toast").hidden = true; }, 7000);
}
const wantVR = q.get("vr") === "1";                                 // opened to be watched in a headset
const EYE = 1.6, WALL_GAP = 0.35, WALK_MPS = 2.4, CELL = 0.25;
const HINT = {
  explore: "Drag to look, W A S D or the arrow keys to walk, click the floor to go there. The view stays inside the rooms.",
  dollhouse: "Drag to turn, scroll to move in and out, right-drag to slide. Walls facing you are left out; the others fill in as you move closer.",
  floorplan: "One floor from straight above, cut off above head height. Drag to slide, scroll to zoom.",
};
let meta, frames, bodies = [], frame = 0, playing = false, follow = true, stepNow = "";
let rooms = [], levels = [{ id: null, name: "Floor", z: 0 }], roomMeshes = [], furnMeshes = [], bareMeshes = [], robot = null, tourWorld = null;
const state = { mode: "explore", level: 0, all: false, measure: false, furniture: true };
const fp = { x: 0, z: 0, yaw: 0, pitch: -0.12, goal: null };        // explore: where you stand and look
const plan = { x: 0, z: 0, half: 10 };                              // floorplan: centre and half the view's height, in metres
const span = { centre: new THREE.Vector3(), radius: 20 };           // the scan's extent, for framing

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.xr.enabled = true; renderer.localClippingEnabled = true;
document.body.prepend(renderer.domElement);
const canvas = renderer.domElement;
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xcfc8bd);  // where the scan has nothing: the building's own stone tone, so a gap in a wall does not glare
const FOV = 70;                                                     // wide, as the scan's own viewer looks across a room
const persp = new THREE.PerspectiveCamera(FOV, innerWidth / innerHeight, 0.05, 600);
const ortho = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 600);
ortho.up.set(0, 0, -1);                                             // north up the screen
let camera = persp;
const rig = new THREE.Group(); rig.add(persp); scene.add(rig);     // in a headset the rig is where you stand
const orbit = new OrbitControls(persp, canvas); orbit.enableDamping = true; orbit.enabled = false; orbit.maxPolarAngle = 1.5; orbit.minPolarAngle = 0.05;
scene.add(new THREE.HemisphereLight(0xffffff, 0x9a8f80, 1.6)); const sun = new THREE.DirectionalLight(0xffffff, 1.4); sun.position.set(3, 8, 2); scene.add(sun);
const world = new THREE.Group(); world.rotation.x = -Math.PI / 2; scene.add(world);

/* ---------- the room's materials: one switch for the walls' fade, one pair of cutting planes ---------- */

const wallFade = { value: 1 };   // how solid an upright surface is: 1 in a room, less from far off in the dollhouse
const cut = [new THREE.Plane(new THREE.Vector3(0, 1, 0), 1e4), new THREE.Plane(new THREE.Vector3(0, -1, 0), 1e4)];  // keep what is between two heights
function roomMaterial(map) {

  m.onBeforeCompile = sh => {    // a surface's uprightness, from its normal (the mesh's own frame has Z up), scales its opacity

    sh.vertexShader = sh.vertexShader.replace("#include <common>", "#include <common>\nvarying float vUpright;")
      .replace("#include <begin_vertex>", "#include <begin_vertex>\nvUpright = 1.0 - abs(normal.z);");
    sh.fragmentShader = sh.fragmentShader.replace("#include <common>", "#include <common>\nuniform float uWall;\nvarying float vUpright;")
      .replace("#include <map_fragment>", "#include <map_fragment>\ndiffuseColor.a *= mix(1.0, uWall, smoothstep(0.45, 0.8, vUpright));");

function dressRoom() {           // per mode: which faces are drawn, whether opacity is in play, where the scan is cut
  const doll = state.mode === "dollhouse";
  for (const o of roomMeshes) {

    if (o.material.side !== side || o.material.alphaHash !== doll) { o.material.side = side; o.material.alphaHash = doll; o.material.alphaToCoverage = doll; o.material.needsUpdate = true; }  // thinned through the antialiasing samples: no sorting, little grain
  }
  const lv = levels[state.level], above = levels[state.level + 1];
  let low = -1e4, high = 1e4;
  if (state.mode === "floorplan") { low = lv.z - 0.4; high = lv.z + 2.2; }
  else if (doll && !state.all) { low = lv.z - 0.4; high = above ? above.z - 0.38 : 1e4; }
  cut[0].constant = -low; cut[1].constant = high;
  furnMeshes.forEach(o => { o.visible = state.furniture; });
  bareMeshes.forEach(o => { o.visible = !state.furniture; });   // the tables' shadows go with the tables
  if (drawn) drawn.furniture.visible = state.furniture;
  if (robot) robot.visible = state.all || state.level === 0;    // the robot works on the world's own floor
  if (!doll) wallFade.value = 1;
}

/* ---------- the robot's playback ---------- */

const robotAt = () => { const o = Math.floor(frame) * bodies.length * 7; return new THREE.Vector3(frames[o], frames[o + 2], -frames[o + 1]); };
function show(i) {
  frame = Math.max(0, Math.min(meta.n - 1, i)); const k = Math.floor(frame) * bodies.length * 7;
  bodies.forEach((b, j) => { if (!b) return; const o = k + j * 7; b.position.set(frames[o], frames[o + 1], frames[o + 2]); b.quaternion.set(frames[o + 4], frames[o + 5], frames[o + 6], frames[o + 3]); });

  ray.setFromCamera(new THREE.Vector2(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1), persp);
  const hit = ray.intersectObjects(roomMeshes.filter(o => o.visible).concat(drawn ? drawn.floors : []), false)[0], lv = levels[state.level];

canvas.addEventListener("pointercancel", () => { drag = null; });
canvas.addEventListener("wheel", e => {
  if (state.mode === "explore") { const step = -Math.sign(e.deltaY) * 0.6, at = standAt(fp.x - Math.sin(fp.yaw) * step, fp.z - Math.cos(fp.yaw) * step); fp.x = at.x; fp.z = at.z; fp.goal = null; e.preventDefault(); }

}, { passive: false });
addEventListener("keydown", e => { if (e.target.closest?.("input, select, textarea") || e.metaKey || e.ctrlKey) return; const k = e.key.toLowerCase();

    if (!e.repeat && state.mode === "explore") {   // a tap is a step (or a small turn); holding the key walks on from there
      const f = (k === "w" || k === "arrowup") - (k === "s" || k === "arrowdown"), sd = (k === "d") - (k === "a"), s = Math.sin(fp.yaw), c = Math.cos(fp.yaw);
      if (f || sd) { const at = standAt(fp.x + (-s * f + c * sd) * 0.3, fp.z + (-c * f - s * sd) * 0.3); fp.x = at.x; fp.z = at.z; fp.goal = null; }
      else fp.yaw += ((k === "q" || k === "arrowleft") - (k === "e" || k === "arrowright")) * 0.09;
    } }

addEventListener("keyup", e => keys.delete(e.key.toLowerCase()));
addEventListener("blur", () => keys.clear());
addEventListener("resize", () => { persp.aspect = innerWidth / innerHeight; persp.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); if (state.mode === "floorplan") placePlan(); });

/* ---------- buttons ---------- */

for (const m of ["dollhouse", "floorplan", "explore"]) $("m-" + m).onclick = () => setMode(m);
function shut(but) {             // the floor list and the menu: one open at a time, and neither once you go back to the room
  for (const [sheet, button] of [["floors", "floor"], ["menu", "dots"]]) if (sheet !== but) { $(sheet).hidden = true; $(button).setAttribute("aria-expanded", "false"); }
}
const toggle = (sheet, button) => { const open = $(sheet).hidden; shut(sheet); $(sheet).hidden = !open; $(button).setAttribute("aria-expanded", String(open)); };
$("floor").onclick = () => toggle("floors", "floor");
$("dots").onclick = () => toggle("menu", "dots");
canvas.addEventListener("pointerdown", () => shut());
$("share").onclick = async () => {
  try { await navigator.clipboard.writeText(location.href); say("Link copied: " + location.href); }
  catch (e) { say("Could not copy the link here. It is in the address bar: " + location.href); }
};
$("floors").onclick = e => { const b = e.target.closest("button"); if (!b) return; shut();
  if (b.dataset.level === "all") setLevel(state.level, true); else setLevel(+b.dataset.level); };
$("measure").onclick = () => { state.measure = !state.measure; paint();
  if (state.measure) say(state.all || state.level === 0 ? "Doorways, walls and the gaps between tables. ≈ marks a length traced by eye; the tables were measured on the scan." : "The world file has no measurements for this floor."); };
$("furniture").onclick = () => { state.furniture = !state.furniture; dressRoom(); paint(); say(state.furniture ? HINT[state.mode] : "Furniture hidden: the tables, and what stands outside the rooms. Chairs and people inside the rooms were already taken out of the scan."); };
$("play").onclick = () => { if (!bodies.length) return; if (frame >= meta.n - 1) show(0); setPlaying(!playing); };
const jump = i => { if (!bodies.length) return; show(i); if (follow && state.mode === "explore" && state.level === 0) standBy(); };
$("seek").oninput = e => jump(+e.target.value);
$("chapter").onchange = e => jump(meta.chapters[+e.target.value].t * meta.fps + 1);
$("follow").onclick = () => { setFollow(!follow); if (follow) jump(frame); };
$("vr").onclick = () => { shut(); enterVR(); }; $("vr-big").onclick = enterVR;
$("vr-skip").onclick = () => { $("vrgate").hidden = true; };
window.room = { state, fp, plan, orbit, levels: () => levels, setMode, setLevel, robotAt, get camera() { return camera; }, counts: () => ({ room: roomMeshes.length, furniture: furnMeshes.length, measures: measures.items.length, drawn: drawn ? drawn.floors.length : 0 }),
  vr: { VR, state: vr, rig, tag, shade, rigFor, headIn, placeHead, turnHead, stepHead, spotBy, sees, inRooms, leashStep, tagFrame, pads, vrFrame, enterVR, leftVR }, get playing() { return playing; }, get follow() { return follow; }, get frame() { return frame; } };  // for checking from the console
</script>
